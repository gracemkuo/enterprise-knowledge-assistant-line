[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-assistant"
version = "0.2.0"
description = "A LINE and WhatsApp knowledge assistant backed by Google Agent Search"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "google-auth>=2.38,<3",
  "httpx>=0.27,<1",
  "line-bot-sdk>=3.19,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
